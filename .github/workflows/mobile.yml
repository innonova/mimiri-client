name: Mobile

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    android:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  cache: npm

            - name: Setup Java
              uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
              with:
                  distribution: temurin
                  java-version: 21

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

            - name: Install dependencies
              run: npm ci

            - name: Build web app
              run: npm run build-only

            - name: Capacitor sync
              run: npx cap sync android

            - name: Check for uncommitted generated files
              run: git diff --exit-code -- android

            - name: Build Android app (unsigned)
              run: ./gradlew assembleRelease
              working-directory: android

            - name: Upload APK artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: app-release-unsigned
                  path: android/app/build/outputs/apk/release/*.apk
                  retention-days: 7

    ios:
        runs-on: macos-15

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build web app
              run: npm run build-only

            - name: Capacitor sync
              run: npx cap sync ios

            - name: Check for uncommitted generated files
              # Podfile.lock excluded for now: runner CocoaPods version can differ
              # from the one used locally, producing spurious lockfile churn
              run: git diff --exit-code -- ios ':!ios/App/Podfile.lock'

            - name: Build iOS app (no signing)
              run: |
                  xcodebuild build \
                    -workspace App/App.xcworkspace \
                    -scheme App \
                    -configuration Release \
                    -destination generic/platform=iOS \
                    CODE_SIGNING_ALLOWED=NO
              working-directory: ios
