name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    ci:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            # - name: Prettier
            #   run: npm run prettier

            - name: Lint
              run: npm run lint

            - name: Type check
              run: npm run type-check

            - name: Unit tests
              run: npm test
